<?xml version="1.0" encoding="UTF-8"?>
<svg
    xmlns="http://www.w3.org/2000/svg"
    width="5mm"
    height="5mm"
    viewBox="0 0 5 5">

    <!-- Diagonal lines -->
    <line x1="0" y1="5" x2="5" y2="0"
          stroke="black"
          stroke-width="0.2"
          opacity="0.03"/>

    <line x1="0" y1="0" x2="5" y2="5"
          stroke="black"
          stroke-width="0.2"
          opacity="0.03"/>

    <!-- Center point -->
    <circle cx="2.5" cy="2.5" r="0.35"
            fill="black"
            opacity="0.04"/>
</svg>
